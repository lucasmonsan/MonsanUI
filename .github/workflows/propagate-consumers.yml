name: Propagate MonsanUI revision

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/propagate-monsan-ui.mjs'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monsan-ui-consumer-propagation
  cancel-in-progress: false

jobs:
  propagate:
    if: github.repository == 'lucasmonsan/MonsanUI'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MONSAN_SUITE_AUTOMATION_TOKEN }}
      MONSAN_UI_READ_TOKEN: ${{ github.token }}
      MONSAN_UI_SHA: ${{ github.sha }}

    steps:
      - name: Checkout MonsanUI
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Report disabled propagation
        if: env.GH_TOKEN == ''
        run: echo "Consumer propagation is disabled until MONSAN_SUITE_AUTOMATION_TOKEN is configured."

      - name: Verify automation access
        if: env.GH_TOKEN != ''
        run: |
          gh auth status

      - name: Create consumer update pull requests
        if: env.GH_TOKEN != ''
        run: node scripts/propagate-monsan-ui.mjs
